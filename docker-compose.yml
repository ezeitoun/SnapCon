# SnapCon via Docker — for always-on hosts (Pi / NAS / homelab).
#
# Quick start (Linux host):
#   ./docker-setup.sh                        # creates config.json, users.json,
#                                            # gcode/ and the data folders
#   docker compose up -d --build
#   open http://<this-host-ip>:4545
#
# Or by hand:
#   cp config.example.json config.json      # a writable config the hub persists to
#   mkdir -p gcode                           # where your sliced .gcode lives
#   touch users.json                        # pre-create as a FILE — a missing
#                                            # bind-mount source for a single
#                                            # FILE (unlike a directory) gets
#                                            # created by Docker as an empty
#                                            # DIRECTORY instead, which breaks
#                                            # User Access Management the
#                                            # moment it's turned on
#   docker compose up -d --build
#
# Auto-discovery scans your LAN, which only works with host networking (Linux
# hosts). On Docker Desktop (macOS/Windows) host networking behaves differently —
# start it with the override file instead, which publishes port 4545, and add
# printers by IP in Settings:
#   docker compose -f docker-compose.yml -f docker-compose.desktop.yml up -d --build
#
# Optional settings (time zone, ffmpeg, port) go in a .env file next to this
# one — see .env.example.

services:
  snapcon:
    # Build from this repo. (Once images are published you could instead use:
    #   image: ghcr.io/ezeitoun/snapcon:latest )
    build:
      context: .
      args:
        # ffmpeg gives relayed cameras (Bambu Lab) still frames for snapshots
        # and notification images. false = smaller image, live view unchanged.
        WITH_FFMPEG: ${SNAPCON_WITH_FFMPEG:-true}
    image: snapcon:local
    container_name: snapcon
    restart: unless-stopped
    # A tiny init as PID 1: forwards `docker stop` to Node right away and
    # reaps child processes (ffmpeg, the Remote Access tunnel).
    init: true
    environment:
      # Local time for log and audit-trail timestamps.
      TZ: ${TZ:-UTC}

    # --- Linux hosts: host networking enables LAN auto-discovery ---
    network_mode: host

    # --- Docker Desktop (macOS/Windows): comment out network_mode above and
    #     uncomment this instead, then add printers by IP (discovery won't scan) ---
    # ports:
    #   - "4545:4545"

    # users.json and remote-access-data/ must be mounted too, not just
    # config.json — otherwise recreating the container (an image update,
    # `docker compose up -d --build`) silently wipes every user account
    # (while config.json's usersEnabled:true survives, locking everyone out)
    # and orphans any live Remote Access tunnel.
    volumes:
      - ./config.json:/app/config.json              # persists your printer list & settings
      - ./gcode:/app/gcode                          # your Orca output folder
      - ./users.json:/app/users.json                # User Access Management accounts
      - ./remote-access-data:/app/remote-access-data # Remote Access tunnel identity/token
      # The whole directory, not just audit-data/audit.db — SQLite's WAL mode
      # writes -wal/-shm sidecar files alongside it, which a single-file mount
      # would leave behind (and silently lose) on every container recreate.
      - ./audit-data:/app/audit-data                 # Settings > Logs audit trail
      # Same WAL-sidecar-files reasoning as audit-data above.
      - ./sync-data:/app/sync-data                   # Logs/Camera sync history (dedup + retention records)
      # A directory mount, not a single file — Queue Management's
      # queue-data.json is written via a temp-file-then-rename-with-backup
      # sequence (crash-safe atomic replace), which only works reliably when
      # the temp file and the real one share the same underlying mount.
      - ./data:/app/data                              # Queue Management state (only used if the feature is enabled)
      # Optional — without it, a container recreate just forgets which
      # printers have a file sitting on them ready to print (nothing lost,
      # just re-upload/re-select). Same "pre-create as a FILE" caveat as
      # users.json above if you do mount it: touch queued-files.json first.
      # - ./queued-files.json:/app/queued-files.json
      # Added languages, edits made through the Language Editor, and the
      # first-run-seeded en.json/es.json all live here — without this mount,
      # a container recreate silently reverts to the two bundled defaults
      # and discards anything an admin added/edited.
      - ./locales:/app/locales                       # installed/edited language files
